name: 自动更新GWF库

# 设置触发条件
on:
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      build:
        description: 'build gwf'
        required: true
        default: 'build gwf'
  # 定时触发编译(每30分钟)
  schedule:
     - cron: '*/30 * * * *'
  # 点☆Star触发开始编译
  watch:  
     types: [started]
  # 代码推送触发（用于 sing-box 规则集更新）
  push:
    branches: [main]
    paths:
      - 'clash/RuleSet/*.yaml'
      - 'clash/RuleSet/*.list.tmp'
      - 'clash/RuleSet/*.yaml.tmp'
      - 'scripts/convert_rules.py'
   
# 授予工作流写权限（用于自动提交及删除旧的 workflow run）
permissions:
  contents: write
  actions: write

# 任务集
jobs:
  gwf:
    # 选择虚拟环境
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id
    
    # 运行步骤
    steps:
    
    # 检出各个代码模块
    - name: 检出各个代码模块
      uses: actions/checkout@v7
    
    # 自动更新IP库
    - name: 自动更新GWF库
      run: |
          bash default/gwf.sh
    
    # 转换 Clash 规则为 sing-box JSON
    - name: 转换 Clash 规则为 sing-box JSON
      run: |
        echo "开始转换规则集..."
        cd scripts
        python3 convert_rules.py
        echo "✓ JSON 转换完成"

    # 安装 sing-box
    - name: 安装 sing-box
      run: |
        echo "获取最新版本..."
        LATEST_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
        VERSION_NUM=${LATEST_VERSION#v}
        echo "版本: ${LATEST_VERSION}"
        
        echo "下载 sing-box..."
        wget -q --timeout=30 --tries=3 \
          "https://github.com/SagerNet/sing-box/releases/download/${LATEST_VERSION}/sing-box-${VERSION_NUM}-linux-amd64.tar.gz"
        
        echo "安装..."
        tar -xzf sing-box-${VERSION_NUM}-linux-amd64.tar.gz
        sudo install -m 755 sing-box-${VERSION_NUM}-linux-amd64/sing-box /usr/local/bin/sing-box
        
        echo "验证..."
        sing-box version

    # 编译 sing-box 规则集为 SRS 格式
    - name: 编译 sing-box 规则集为 SRS 格式
      run: |
        echo "开始编译 SRS 格式..."
        cd singbox/rule-set
        
        for json_file in *.json; do
          if [ -f "$json_file" ]; then
            srs_file="${json_file%.json}.srs"
            if sing-box rule-set compile "$json_file" -o "$srs_file" 2>/dev/null; then
              echo "✓ $json_file"
            else
              echo "✗ $json_file (跳过)"
            fi
          fi
        done
        
        echo ""
        echo "统计: JSON $(ls *.json | wc -l) 个, SRS $(ls *.srs | wc -l) 个"
    
    # 清理临时文件
    - name: 清理 sing-box 临时文件
      run: |
        echo "清理临时文件..."
        rm -rf sing-box-*.tar.gz sing-box-*.tar.gz.* sing-box-*-linux-*/ 2>/dev/null || true
        echo "✓ 临时文件已清理"
    
    # 自动上传     
    - name: 自动上传
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: Update GWF
        skip_dirty_check: false
        commit_user_name: Action Bot
        commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
        commit_author: Action <actions@github.com>
    
    # 清理缓存
    - name: 自动更新GWF库缓存
      run: |
        bash default/purge.sh
    
    # 删除旧的GitHub-workflow    
    - name: 删除旧的GitHub-workflow
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 1    #保留多少个workflow不删除
