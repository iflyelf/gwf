name: 构建 sing-box 规则集

on:
  push:
    branches: [main]
    paths:
      - 'clash/RuleSet/*.yaml'
      - 'scripts/convert_rules.py'
  workflow_dispatch:

# 授予工作流写权限
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 转换 Clash 规则为 sing-box JSON
        run: |
          echo "开始转换规则集..."
          cd scripts
          python3 convert_rules.py
          echo "✓ JSON 转换完成"

      - name: 安装 sing-box
        run: |
          echo "获取最新版本..."
          LATEST_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          VERSION_NUM=${LATEST_VERSION#v}
          echo "版本: ${LATEST_VERSION}"
          
          echo "下载 sing-box..."
          wget -q --timeout=30 --tries=3 \
            "https://github.com/SagerNet/sing-box/releases/download/${LATEST_VERSION}/sing-box-${VERSION_NUM}-linux-amd64.tar.gz"
          
          echo "安装..."
          tar -xzf sing-box-${VERSION_NUM}-linux-amd64.tar.gz
          sudo install -m 755 sing-box-${VERSION_NUM}-linux-amd64/sing-box /usr/local/bin/sing-box
          
          echo "验证..."
          sing-box version

      - name: 编译 sing-box 规则集为 SRS 格式
        run: |
          echo "开始编译 SRS 格式..."
          cd singbox/rule-set
          
          for json_file in *.json; do
            if [ -f "$json_file" ]; then
              srs_file="${json_file%.json}.srs"
              if sing-box rule-set compile "$json_file" -o "$srs_file" 2>/dev/null; then
                echo "✓ $json_file"
              else
                echo "✗ $json_file (跳过)"
              fi
            fi
          done
          
          echo ""
          echo "统计: JSON $(ls *.json | wc -l) 个, SRS $(ls *.srs | wc -l) 个"

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add singbox/rule-set/*.json singbox/rule-set/*.srs 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有更改"
          else
            git commit -m "chore: 更新 sing-box 规则集 [skip ci]"
            git push
            echo "✓ 已推送更新"
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 1
