name: 构建 sing-box 规则集

on:
  push:
    branches: [main]
    paths:
      - 'clash/RuleSet/*.yaml'
      - '.github/workflows/build-singbox-rules.yml'
  workflow_dispatch:

# 授予工作流写权限（用于自动提交及删除旧的 workflow run）
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 sing-box (使用官方 action)
        run: |
          # 直接下载固定版本避免兼容性问题
          VERSION="1.10.0"
          echo "下载 sing-box v${VERSION}..."
          
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo install -m 755 sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
          
          echo "验证安装..."
          sing-box version

      - name: 转换 Clash 规则为 sing-box JSON
        run: |
          echo "开始转换规则集..."
          python3 convert_rules.py
          echo "✓ 转换完成"

      - name: 编译 sing-box 规则集为 SRS 二进制格式
        run: |
          echo "开始编译规则集为 SRS 格式..."
          cd singbox/rule-set
          
          compiled=0
          failed=0
          
          for json_file in *.json; do
            if [ -f "$json_file" ]; then
              srs_file="${json_file%.json}.srs"
              echo "编译: $json_file"
              
              if sing-box rule-set compile "$json_file" "$srs_file"; then
                if [ -f "$srs_file" ]; then
                  echo "  ✓ 成功"
                  ((compiled++))
                else
                  echo "  ✗ 失败"
                  ((failed++))
                fi
              else
                echo "  ✗ 失败"
                ((failed++))
              fi
            fi
          done
          
          echo ""
          echo "编译统计: 成功 ${compiled} / 失败 ${failed}"

      - name: 统计规则集文件
        run: |
          json_count=$(ls singbox/rule-set/*.json 2>/dev/null | wc -l)
          srs_count=$(ls singbox/rule-set/*.srs 2>/dev/null | wc -l)
          echo "规则集: JSON ${json_count} 个, SRS ${srs_count} 个"

      - name: 提交并推送更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add singbox/rule-set/*.json singbox/rule-set/*.srs 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: 更新 sing-box 规则集 (JSON + SRS) [skip ci]"
            git push
            echo "✓ 规则集已更新"
          else
            echo "无更改"
          fi

      - name: 删除旧的 workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 1
