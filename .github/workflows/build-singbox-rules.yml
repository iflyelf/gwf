name: 构建 sing-box 规则集

on:
  push:
    branches: [main]
    paths:
      - 'clash/RuleSet/*.yaml'
      - '.github/workflows/build-singbox-rules.yml'
  workflow_dispatch:

# 授予工作流写权限（用于自动提交及删除旧的 workflow run）
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 转换 Clash 规则为 sing-box JSON
        run: |
          echo "开始转换规则集..."
          python3 convert_rules.py
          echo "✓ 转换完成"
          
      - name: 统计规则集文件
        run: |
          json_count=$(ls singbox/rule-set/*.json 2>/dev/null | wc -l)
          echo "已生成 ${json_count} 个 JSON 规则集文件"
          ls -lh singbox/rule-set/*.json | head -10

      - name: 提交并推送更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add singbox/rule-set/*.json
          if git diff --staged --quiet; then
            echo "没有需要提交的更改"
          else
            git commit -m "chore: 更新 sing-box 规则集 [skip ci]"
            git push
            echo "✓ 规则集已更新并推送"
          fi

      - name: 删除旧的 workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 1
