name: Build sing-box Rule Sets

on:
  push:
    branches: [main]
    paths:
      - 'clash/RuleSet/*.yaml'
      - 'singbox/rule-set/*.json'
      - '.github/workflows/build-singbox-rules.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          wget -O sing-box.deb https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box_1.9.0_linux_amd64.deb
          sudo dpkg -i sing-box.deb
          sing-box version

      - name: Convert Clash rules to sing-box JSON
        run: |
          python3 convert_rules.py
        working-directory: .

      - name: Compile sing-box rule sets to binary format
        run: |
          cd singbox/rule-set
          for json_file in *.json; do
            if [ -f "$json_file" ]; then
              srs_file="${json_file%.json}.srs"
              echo "Compiling $json_file -> $srs_file"
              sing-box rule-set compile "$json_file" -o "$srs_file"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add singbox/rule-set/*.json singbox/rule-set/*.srs
          git diff --staged --quiet || git commit -m "chore: update sing-box rule sets [skip ci]"
          git push
